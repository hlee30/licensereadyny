<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NY Real Estate Practice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <header>
            <h1>NY Real Estate Practice</h1>
            <p>New York Real Estate Salesperson Exam Prep</p>
        </header>

        <div class="quiz-info">
            <span id="question-number"></span>
            <span id="score">Score: 0</span>
        </div>

        <main id="quiz-area">

            <h2 id="question">
                Question goes here
            </h2>

            <div id="answers"></div>

            <div id="feedback"></div>

            <div class="question-actions">

                <button id="next-button" class="next-button">
                    Next Question
                </button>

                <button id="contact-button" class="contact-button">
                    Report Incorrect Answer
                </button>

            </div>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
